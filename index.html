/* Layout: layar PID satu halaman. Jadwal visual 8 kegiatan selalu tampil di atas (kelas yang dapat diprediksi),
   panggung di tengah dengan instruksi singkat di atas dan area sentuh di bawah, bilah guru di bawah.
   Satu dunia visual terang dan tenang (biru baja, tanpa animasi ramai), sengaja satu tema. */
:root{
  --steel:#2E5E7E; --steel-d:#1D3F57; --steel-l:#E6EEF4; --mist:#F3F6F8; --paper:#FFFFFF;
  --ink:#22303A; --muted:#5F6E79; --line:#D6E1EA;
  --gold:#E0A43A; --gold-d:#A9741C; --gold-l:#FBF0D9;
  --heat:#C9653F; --heat-l:#FBE7DE; --cold:#3F78B5; --cold-l:#E3EDF8;
  --ok:#3E8E5A; --ok-l:#E3F2E8;
  --fajar:#2F6FA3; --putri:#7B63B0; --raka:#2E8A74; --dewi:#C27A28;
  --night:#14222C;
  --display:'Lexend MPI','Lexend','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson MPI','Atkinson Hyperlegible','Segoe UI',Roboto,system-ui,sans-serif;
  --r:clamp(10px,1.6vh,18px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--mist);color:var(--ink);font-family:var(--body);font-weight:400;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
svg{display:block}
input,select,textarea{font:inherit;color:var(--ink)}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
#app>*{min-width:0}

/* ---------- bilah atas: jadwal visual */
.top{display:flex;align-items:stretch;gap:clamp(8px,1.2vw,22px);padding:clamp(6px,.9vh,10px) max(16px,1.6vw);background:var(--steel-d);color:#fff}
.brand{display:flex;flex-direction:column;justify-content:center;line-height:1.15;min-width:0;flex:none;max-width:19vw}
.brand b{font-family:var(--display);font-weight:700;font-size:clamp(14px,2.1vh,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:clamp(11px,1.5vh,15px);color:#C7D8E5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msched{flex:1;display:flex;gap:clamp(4px,.5vw,8px);min-width:0;overflow-x:auto;scrollbar-width:none}
.msched::-webkit-scrollbar{display:none}
.mi{position:relative;flex:1 1 0;min-width:clamp(44px,5vw,96px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:clamp(3px,.5vh,6px) 4px;border-radius:12px;background:rgba(255,255,255,.08);color:#DCE7EF;opacity:.72}
.mi .mic{height:clamp(24px,4.4vh,48px);aspect-ratio:1;display:grid;place-items:center;background:#fff;border-radius:10px;padding:3px}
.mi .mic svg{height:100%;width:auto}
.mi .ml{font-size:clamp(10px,1.3vh,14px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mi .mn{position:absolute;left:6px;top:3px;font-family:var(--display);font-size:clamp(10px,1.2vh,13px);font-weight:700;color:#9DB6C8}
.mi.now{opacity:1;background:var(--gold);color:var(--steel-d);box-shadow:0 0 0 3px #fff}
.mi.now .mn{color:var(--steel-d)}
.mi.done{opacity:1}
.mi.done .mic{background:var(--ok-l)}
.mi .ck{position:absolute;right:4px;top:3px;width:clamp(16px,2.2vh,24px);height:clamp(16px,2.2vh,24px);border-radius:50%;background:var(--ok);display:none;place-items:center}
.mi.done .ck{display:grid}
.mi .ck svg{width:70%;height:70%}
.code{flex:none;display:flex;flex-direction:column;justify-content:center;text-align:right;font-size:clamp(11px,1.45vh,15px);color:#C7D8E5;white-space:nowrap;max-width:15vw;overflow:hidden}
.code b{display:block;color:var(--gold);font-family:var(--display);font-size:clamp(13px,1.8vh,19px)}
@media (max-width:1100px){.mi .ml{display:none}.brand{max-width:26vw}}
@media (max-width:700px){.brand,.code{display:none}}

/* ---------- panggung */
.stage{position:relative;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(8px,1.4vh,20px);padding:clamp(10px,1.8vh,24px) max(16px,2.6vw) clamp(10px,1.8vh,22px)}
.stage.dark{background:var(--night);color:#fff}
.head{display:flex;align-items:center;gap:clamp(10px,1.2vw,20px);min-width:0}
.say-btn{flex:none;width:clamp(48px,8.4vh,92px);height:clamp(48px,8.4vh,92px);border-radius:50%;background:var(--gold);display:grid;place-items:center;box-shadow:0 4px 0 var(--gold-d)}
.say-btn svg{width:50%;height:50%}
.say-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.htext{min-width:0;flex:1}
.kick{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--gold-d);font-size:clamp(12px,1.75vh,18px);letter-spacing:.06em;text-transform:uppercase}
.kick .sicmini{height:clamp(20px,3vh,32px);width:auto;flex:none}
.kick .sicmini svg{height:100%;width:auto}
.stage.dark .kick{color:var(--gold)}
.htext h1{margin:.12em 0 0;font-family:var(--display);font-weight:700;color:var(--steel-d);font-size:clamp(20px,min(5.4vh,4.2vw),64px);line-height:1.1;text-wrap:balance}
.stage.dark .htext h1{color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center;max-width:48%}
.play{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:clamp(10px,1.8vh,24px);overflow-y:auto;overflow-x:hidden;padding:8px 4px 4px}
.play>:first-child{margin-top:auto}
body.mid .play>:last-child{margin-bottom:auto}
@media (max-width:760px){.head{flex-wrap:wrap}.tools{max-width:100%;justify-content:flex-start}}

/* chip guru & tombol pilihan */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:clamp(36px,5vh,52px);padding:4px clamp(10px,1vw,18px);border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:clamp(12px,1.65vh,17px);color:var(--steel-d)}
.chip svg{width:1.2em;height:1.2em;flex:none}
.chip.on{background:var(--steel);border-color:var(--steel);color:#fff}
.stage.dark .chip{background:#22343F;border-color:#3A5160;color:#fff}
.seg{display:inline-flex;border-radius:999px;background:#fff;border:2px solid var(--line);overflow:hidden}
.seg button{min-height:clamp(34px,4.8vh,50px);padding:0 clamp(10px,1vw,16px);font-weight:700;font-size:clamp(12px,1.65vh,17px);color:var(--muted)}
.seg button.on{background:var(--steel);color:#fff}
.stage.dark .seg{background:#22343F;border-color:#3A5160}.stage.dark .seg button{color:#C7D8E5}.stage.dark .seg button.on{background:var(--gold);color:var(--steel-d)}

/* pilih murid */
.mchips{display:flex;gap:clamp(8px,1vw,16px);justify-content:center;flex-wrap:wrap}
.mchip{display:inline-flex;align-items:center;gap:10px;min-height:clamp(46px,7vh,76px);padding:6px clamp(14px,1.4vw,24px) 6px 6px;border-radius:999px;background:#fff;border:3px solid var(--mc);font-family:var(--display);font-weight:700;font-size:clamp(15px,2.5vh,28px);color:var(--ink)}
.mchip .sym{width:clamp(34px,5.4vh,60px);height:clamp(34px,5.4vh,60px);border-radius:50%;background:var(--mc);color:#fff;display:grid;place-items:center}
.mchip .sym svg{width:62%;height:62%}
.mchip.on{background:var(--mc);color:#fff}
.mchip.on .sym{background:#fff;color:var(--mc)}
.mchip .mk{display:inline-grid;place-items:center;min-width:1.4em;height:1.4em;border-radius:999px;background:var(--ok);color:#fff;font-size:.7em}
.stage.dark .mchip{background:#22343F;color:#fff}

/* kartu jadwal besar */
.bsched{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:clamp(8px,1vw,18px);width:100%}
@media (max-width:1100px){.bsched{grid-template-columns:repeat(4,minmax(0,1fr))}}
.scard{position:relative;min-width:0;padding:clamp(10px,1.6vh,20px) 8px clamp(10px,1.6vh,20px);border-radius:calc(var(--r)*1.4);background:#fff;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1vh,12px);transition:background .25s}
.scard .snum{position:absolute;left:12px;top:8px;font-family:var(--display);font-weight:700;color:var(--muted);font-size:clamp(14px,2.3vh,26px)}
.scard .sic{height:clamp(56px,16vh,180px);display:grid;place-items:center}
.scard .sic svg{height:100%;width:auto;max-width:100%}
.scard .slab{font-family:var(--display);font-weight:700;font-size:clamp(14px,2.5vh,28px);text-align:center;color:var(--steel-d);line-height:1.15;text-wrap:balance}
.scard .tick{position:absolute;right:-8px;top:-8px;width:clamp(30px,5.4vh,60px);height:clamp(30px,5.4vh,60px);border-radius:50%;background:var(--ok);display:grid;place-items:center;transform:scale(0);transition:transform .25s}
.scard .tick svg{width:62%;height:62%}
.scard.done{background:var(--ok-l)}
.scard.done .tick{transform:scale(1)}
.scard.done .sic{opacity:.55}
.scard.now{outline:5px solid var(--gold);outline-offset:3px}

/* termometer perasaan */
.thermo{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1vw,18px);width:min(100%,170vh)}
.fbtn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:clamp(8px,1.4vh,16px) 6px;border-radius:calc(var(--r)*1.4);background:#fff;border:4px solid var(--fc);box-shadow:0 5px 0 var(--line)}
.fbtn .bar{width:100%;height:clamp(10px,1.6vh,18px);border-radius:999px;background:var(--fc)}
.fbtn svg{width:clamp(64px,16vh,170px);height:auto}
.fbtn b{font-family:var(--display);font-weight:700;font-size:clamp(14px,2.5vh,28px);color:var(--ink);text-align:center;line-height:1.1}
.fbtn small{font-size:clamp(11px,1.6vh,17px);color:var(--muted);text-align:center}
.fbtn.sel{background:var(--fc);}
.fbtn.sel b,.fbtn.sel small{color:#fff}
.strats{display:flex;gap:clamp(10px,1.4vw,24px);justify-content:center;flex-wrap:wrap;align-items:center}
.strats .lead{font-family:var(--display);font-weight:700;font-size:clamp(15px,2.4vh,26px);color:var(--steel-d)}

/* kartu gambar besar (pilihan, benda) */
.pc{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1vh,12px);padding:clamp(10px,1.6vh,20px) clamp(12px,1.2vw,22px);border-radius:calc(var(--r)*1.4);background:#fff;box-shadow:0 5px 0 var(--line);border:4px solid transparent;min-width:0}
.pc .art{height:var(--ah,22vh);display:grid;place-items:center}
.pc .art svg{height:100%;width:auto;max-width:100%}
.pc b{font-family:var(--display);font-weight:700;font-size:clamp(16px,3vh,34px);color:var(--steel-d);text-align:center;line-height:1.1}
.pc.sel{border-color:var(--gold);background:var(--gold-l)}
.pc.ok{border-color:var(--ok);background:var(--ok-l)}
.pc.hint{animation:hint 1.2s 2}
@keyframes hint{50%{box-shadow:0 0 0 8px rgba(224,164,58,.55),0 5px 0 var(--line)}}
.pc .dots{display:flex;gap:6px;min-height:clamp(18px,2.6vh,28px)}
.pc .dots i{width:clamp(18px,2.6vh,28px);height:clamp(18px,2.6vh,28px);border-radius:50%;background:var(--mc);display:grid;place-items:center;color:#fff;padding:4px}
.pc .dots i svg{width:100%;height:100%}
.row{display:flex;gap:clamp(12px,2vw,40px);align-items:stretch;justify-content:center;flex-wrap:wrap;width:100%}
.goal{display:flex;align-items:center;gap:14px;background:var(--steel);color:#fff;border-radius:999px;padding:clamp(8px,1.3vh,14px) clamp(18px,2vw,30px);font-family:var(--display);font-weight:700;font-size:clamp(15px,2.6vh,30px);text-align:center}
.goal small{font-family:var(--body);font-size:.6em;letter-spacing:.1em;text-transform:uppercase;color:#C7D8E5;font-weight:700}

/* cerita sosial */
.story{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:clamp(10px,1.6vw,30px);width:100%}
.spage{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;gap:clamp(14px,2.4vw,48px);background:#fff;border-radius:calc(var(--r)*1.6);box-shadow:0 6px 0 var(--line);padding:clamp(14px,2.6vh,34px) clamp(16px,2vw,40px);min-height:clamp(200px,44vh,520px)}
.spage .art{height:clamp(140px,36vh,420px);display:grid;place-items:center}
.spage .art svg{height:100%;width:auto;max-width:100%}
.spage .sn{font-family:var(--display);font-weight:700;color:var(--gold-d);font-size:clamp(14px,2.2vh,24px);letter-spacing:.06em}
.spage p{margin:.3em 0 0;font-family:var(--display);font-weight:600;color:var(--steel-d);font-size:clamp(22px,5.4vh,64px);line-height:1.18;text-wrap:balance}
.navbig{width:clamp(52px,9vh,100px);height:clamp(52px,9vh,100px);border-radius:50%;background:var(--steel);color:#fff;display:grid;place-items:center}
.navbig svg{width:52%;height:52%}
.navbig[disabled]{opacity:.25}
.pdots{display:flex;gap:8px;justify-content:center}
.pdots i{width:clamp(10px,1.4vh,16px);height:clamp(10px,1.4vh,16px);border-radius:50%;background:var(--line)}
.pdots i.on{background:var(--steel)}
@media (max-width:760px){.spage{grid-template-columns:1fr}.story{grid-template-columns:1fr 1fr}.story .spage{grid-column:1/-1;order:-1}}

/* pilah padat dan cair */
.bins{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,40px);width:100%}
.bin{display:flex;flex-direction:column;gap:10px;border-radius:calc(var(--r)*1.6);border:4px dashed var(--bc);background:var(--bl);padding:clamp(10px,1.6vh,18px);min-height:clamp(120px,24vh,280px)}
.bin .bh{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:clamp(20px,4.4vh,50px);color:var(--bc)}
.bin .bh svg{height:clamp(34px,6vh,70px);width:auto}
.bin .bh small{font-family:var(--body);font-size:.42em;color:var(--muted);font-weight:700;letter-spacing:.04em}
.bin .in{display:flex;flex-wrap:wrap;gap:10px}
.bin .in .pc{--ah:9vh;padding:6px 10px;box-shadow:none}
.bin .in .pc b{font-size:clamp(12px,1.8vh,19px)}
.bin.hint{animation:hint 1.2s 2}
.tray{display:flex;gap:clamp(10px,1.4vw,26px);justify-content:center;flex-wrap:wrap;width:100%}
.tray .pc{--ah:14vh}

/* papan tulis ganda (dugaan | hasil) */
.split{display:grid;grid-template-columns:1fr 1fr;gap:0;width:100%;border-radius:calc(var(--r)*1.6);overflow:hidden;box-shadow:0 6px 0 var(--line);background:#fff;min-height:0}
.side{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,18px);padding:clamp(12px,2vh,26px) clamp(14px,1.6vw,30px);min-width:0}
.side+.side{border-left:4px solid var(--line)}
.side .st{font-family:var(--display);font-weight:700;font-size:clamp(16px,2.8vh,32px);color:var(--steel-d);display:flex;align-items:center;gap:10px}
.side .st i{font-style:normal;font-size:.55em;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--steel);border-radius:999px;padding:.3em .8em}
.side .q{font-size:clamp(15px,2.6vh,30px);font-weight:700;color:var(--ink);text-wrap:balance}
.side .opts{display:flex;gap:clamp(10px,1.2vw,20px);justify-content:center;flex-wrap:wrap}
.side .opts .pc{--ah:16vh;flex:1 1 0}
.locked{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-radius:var(--r);background:var(--mist);border:3px dashed var(--line);color:var(--muted);font-weight:700;font-size:clamp(15px,2.4vh,26px);text-align:center;padding:16px}
.locked svg{height:clamp(48px,10vh,110px);width:auto}
.reveal{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.reveal .art{height:clamp(110px,24vh,280px)}
.reveal .art svg{height:100%;width:auto}
.reveal p{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(18px,3.8vh,44px);color:var(--steel-d);text-align:center;text-wrap:balance}
@media (max-width:760px){.split{grid-template-columns:1fr}.side+.side{border-left:0;border-top:4px solid var(--line)}}
.inp{width:100%;min-height:clamp(42px,6vh,64px);border-radius:14px;border:3px solid var(--line);padding:8px 14px;font-size:clamp(15px,2.3vh,24px);background:#fff;user-select:text;-webkit-user-select:text}

/* pengatur waktu besar (Dewi) */
.tbig{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,3vw,60px);align-items:center;width:100%}
.ring{width:clamp(150px,36vh,400px);height:clamp(150px,36vh,400px);position:relative}
.ring svg{width:100%;height:100%}
.ring .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;color:var(--steel-d);font-variant-numeric:tabular-nums;font-size:clamp(28px,7vh,80px)}
.ring .rt small{font-family:var(--body);font-size:.26em;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.track{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1vw,18px)}
.ms{display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:calc(var(--r)*1.3);background:#fff;padding:clamp(10px,1.6vh,18px) 8px;box-shadow:0 5px 0 var(--line);border:4px solid transparent}
.ms b{font-family:var(--display);font-weight:700;font-size:clamp(18px,3.6vh,40px);color:var(--steel-d)}
.ms .cam{width:clamp(38px,6vh,66px);height:clamp(38px,6vh,66px);border-radius:50%;background:var(--steel-l);color:var(--steel);display:grid;place-items:center}
.ms .cam svg{width:56%;height:56%}
.ms small{font-weight:700;color:var(--muted);font-size:clamp(11px,1.6vh,16px);text-align:center}
.ms.now{border-color:var(--gold);background:var(--gold-l)}
.ms.done{background:var(--ok-l)}
.ms.done .cam{background:var(--ok);color:#fff}
.prompt{font-family:var(--display);font-weight:700;font-size:clamp(18px,3.4vh,40px);color:var(--steel-d);background:var(--gold-l);border:3px solid var(--gold);border-radius:999px;padding:.35em 1em;text-align:center}

/* animasi es mencair, uap, embun */
.scene{position:relative;width:min(100%,120vh);border-radius:calc(var(--r)*1.6);background:#fff;box-shadow:0 6px 0 var(--line);padding:clamp(10px,1.6vh,20px);display:flex;flex-direction:column;align-items:center;gap:10px}
.scene.dk{background:#1B2C38;box-shadow:0 6px 0 #0E1820}
.scene .pic{position:relative;height:clamp(160px,40vh,460px);width:100%;display:grid;place-items:center;touch-action:manipulation}
.scene .pic>svg{height:100%;width:auto;max-width:100%}
.scene .cap{font-family:var(--display);font-weight:700;font-size:clamp(17px,3.2vh,36px);color:var(--steel-d);text-align:center;text-wrap:balance;min-height:1.3em}
.scene.dk .cap{color:#fff}
.circ{position:absolute;width:clamp(60px,12vh,130px);height:clamp(60px,12vh,130px);border:6px solid var(--gold);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 3px rgba(255,255,255,.6)}
.stages{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.wisp{animation:rise 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.wisp.w2{animation-delay:1.5s}.wisp.w3{animation-delay:3s}
@keyframes rise{0%{transform:translateY(16px);opacity:0}30%{opacity:.85}100%{transform:translateY(-34px);opacity:0}}
.drop{transition:opacity 1.2s}
@media (prefers-reduced-motion:reduce){.wisp{animation:none;opacity:.8}}

/* kartu konsep */
.concepts{display:grid;grid-template-columns:1fr;gap:clamp(10px,1.6vh,22px);width:100%}
.cc{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1.1fr);align-items:center;gap:clamp(8px,1vw,18px);background:#fff;border-radius:calc(var(--r)*1.6);box-shadow:0 5px 0 var(--line);padding:clamp(8px,1.4vh,16px) clamp(12px,1.4vw,24px);border-left:12px solid var(--cc)}
.cc .w{display:flex;flex-direction:column;align-items:center;gap:4px}
.cc .w .art{height:clamp(60px,15vh,170px)}
.cc .w .art svg{height:100%;width:auto}
.cc .w b{font-family:var(--display);font-weight:700;font-size:clamp(14px,2.5vh,28px);letter-spacing:.06em;color:var(--steel-d)}
.cc .arrow{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--cc);font-family:var(--display);font-weight:700;font-size:clamp(13px,2.2vh,24px);padding:8px;border-radius:16px}
.cc .arrow .ar svg{width:clamp(70px,11vh,130px);height:auto}
.cc .arrow.go{background:var(--cl)}
.ci{display:inline-block;width:1.4em;height:1.4em;flex:none}.ci svg{width:100%;height:100%}
.concepts.compact{gap:clamp(6px,1vh,12px)}.concepts.compact .cc{padding-block:4px}.concepts.compact .cc .w .art{height:clamp(40px,8vh,96px)}.concepts.compact .cc .name{font-size:clamp(18px,3.6vh,42px)}.concepts.compact .cc .w b{font-size:clamp(12px,1.9vh,20px)}
.cc .eq{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vh,60px);color:var(--muted)}
.cc .name{font-family:var(--display);font-weight:700;font-size:clamp(22px,5vh,60px);color:#fff;background:var(--cc);border-radius:18px;padding:.15em .5em;text-align:center}
.cc .w .art{transition:opacity .6s}
.cc.dim .w:nth-child(1) .art{opacity:.35}

/* tugas TEACCH */
.teach{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1vw,16px);width:100%}
.tq{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:var(--r);padding:clamp(8px,1.2vh,14px) clamp(10px,1vw,16px);border-top:6px solid var(--mc)}
.tq .ti{flex:none;width:clamp(30px,4.6vh,50px);height:clamp(30px,4.6vh,50px);border-radius:12px;background:var(--mc);color:#fff;display:grid;place-items:center}
.tq .ti svg{width:60%;height:60%}
.tq b{display:block;font-size:clamp(11px,1.5vh,15px);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tq span{display:block;font-weight:700;font-size:clamp(13px,2vh,21px);color:var(--ink);line-height:1.25}
@media (max-width:900px){.teach{grid-template-columns:repeat(2,minmax(0,1fr))}}
.task{width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.4vh,18px)}
table.obs{border-collapse:separate;border-spacing:0;width:100%;background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:0 5px 0 var(--line)}
table.obs th,table.obs td{padding:clamp(4px,.7vh,9px) 10px;border-bottom:2px solid var(--mist);text-align:center;vertical-align:middle;font-size:clamp(13px,2vh,22px)}
table.obs th{background:var(--mc,var(--steel));color:#fff;font-family:var(--display);font-weight:700}
table.obs td.m{font-family:var(--display);font-weight:700;color:var(--steel-d);font-size:clamp(16px,2.8vh,32px)}
.stp{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.stp button{border-radius:14px;border:3px solid var(--line);background:#fff;padding:4px;height:clamp(44px,6.4vh,76px);aspect-ratio:1.45}
.stp button svg{height:100%;width:auto;margin:auto}
.stp button.on{border-color:var(--mc,var(--gold));background:var(--gold-l)}
.suhu{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:clamp(14px,2.2vh,24px)}
.suhu input{width:5.2em;min-height:clamp(40px,6vh,60px);border-radius:12px;border:3px solid var(--line);padding:4px 10px;text-align:center;font-weight:700;user-select:text;-webkit-user-select:text}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1vw,16px);width:100%}
.slot{display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:calc(var(--r)*1.3);border:4px dashed var(--line);background:#fff;padding:10px;min-height:clamp(120px,22vh,250px);justify-content:center}
.slot b{font-family:var(--display);font-weight:700;font-size:clamp(16px,3vh,34px);color:var(--steel-d)}
.slot .art{height:clamp(50px,11vh,130px)}
.slot .art svg{height:100%;width:auto}
.slot.fill{border-style:solid;border-color:var(--ok);background:var(--ok-l)}
.done-box{display:flex;align-items:center;gap:14px;border-radius:999px;padding:.4em 1.2em;background:var(--mist);border:3px dashed var(--line);font-family:var(--display);font-weight:700;font-size:clamp(16px,2.8vh,30px);color:var(--muted)}
.done-box svg{width:1.4em;height:1.4em}
.done-box.on{background:var(--ok);border-color:var(--ok);border-style:solid;color:#fff}
.ord{position:absolute;top:-12px;left:-12px;width:clamp(30px,5vh,54px);height:clamp(30px,5vh,54px);border-radius:50%;background:var(--putri);color:#fff;font-family:var(--display);font-weight:700;font-size:clamp(16px,2.8vh,30px);display:grid;place-items:center}
.pc{position:relative}

/* diagram perubahan wujud */
.dg{position:relative;width:min(100%,150vh);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);align-items:center;gap:clamp(4px,.6vw,12px)}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border-radius:calc(var(--r)*1.4);box-shadow:0 5px 0 var(--line);padding:clamp(8px,1.4vh,16px) 6px}
.node .art{height:clamp(60px,14vh,160px)}
.node .art svg{height:100%;width:auto}
.node b{font-family:var(--display);font-weight:700;font-size:clamp(16px,3vh,34px);color:var(--steel-d)}
.node small{font-weight:700;color:var(--muted);font-size:clamp(11px,1.6vh,17px);letter-spacing:.06em;text-transform:uppercase}
.links{display:flex;flex-direction:column;gap:clamp(8px,1.6vh,22px)}
.lk{display:flex;flex-direction:column;align-items:center;gap:4px}
.lk svg{width:100%;height:clamp(18px,3vh,34px)}
.lk .slotl{min-height:clamp(38px,6vh,64px);min-width:80%;border-radius:14px;border:3px dashed var(--lc);background:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:clamp(14px,2.4vh,27px);color:var(--lc);padding:2px 10px}
.lk .slotl.fill{border-style:solid;background:var(--lc);color:#fff}
.lk .slotl.hint{animation:hint 1.2s 2}
.lk small{font-weight:700;font-size:clamp(11px,1.5vh,15px);color:var(--lc)}
.lbank{display:flex;gap:clamp(8px,1vw,16px);justify-content:center;flex-wrap:wrap}
.dlab{min-height:clamp(46px,7vh,76px);padding:0 clamp(16px,1.6vw,30px);border-radius:16px;background:#fff;border:4px solid var(--steel);font-family:var(--display);font-weight:700;font-size:clamp(16px,3vh,34px);color:var(--steel-d);box-shadow:0 5px 0 var(--line)}
.dlab.sel{background:var(--gold-l);border-color:var(--gold)}
.dlab.used{opacity:.25;pointer-events:none}

/* kartu perubahan wujud (unjuk kerja) */
.match{position:relative;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(40px,.5fr) minmax(0,1fr);gap:clamp(6px,1vw,16px);width:min(100%,150vh);align-items:start}
.mcol{display:flex;flex-direction:column;gap:clamp(6px,1.1vh,14px)}
.pair{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:calc(var(--r)*1.2);background:#fff;border:4px solid var(--line);padding:4px 10px;min-height:clamp(48px,8vh,96px)}
.pair .art{height:clamp(34px,6.2vh,76px)}
.pair .art svg{height:100%;width:auto}
.pair .ar{font-family:var(--display);font-weight:700;color:var(--muted);font-size:clamp(18px,3.4vh,38px)}
.nm{border-radius:calc(var(--r)*1.2);background:#fff;border:4px solid var(--line);min-height:clamp(48px,8vh,96px);font-family:var(--display);font-weight:700;font-size:clamp(17px,3.4vh,38px);color:var(--steel-d)}
.pair.sel,.nm.sel{border-color:var(--gold);background:var(--gold-l)}
.pair.ok,.nm.ok{border-color:var(--mc);background:#fff}
.mlines{position:absolute;inset:0;pointer-events:none;overflow:visible}
.qs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.qbig{font-family:var(--display);font-weight:700;font-size:clamp(17px,3vh,34px);color:var(--steel-d);background:#fff;border:3px solid var(--steel);border-radius:999px;padding:.3em 1em;text-align:center}
.rub{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:6px;align-items:center;background:#fff;border-radius:var(--r);padding:10px;box-shadow:0 5px 0 var(--line);width:min(100%,150vh)}
.rub .ak{font-weight:700;font-size:clamp(12px,1.7vh,17px);color:var(--ink);padding-right:8px}
.rub button{min-height:clamp(34px,4.8vh,50px);border-radius:10px;border:2px solid var(--line);font-weight:700;font-size:clamp(12px,1.6vh,16px);color:var(--muted);background:var(--mist)}
.rub button.on{background:var(--steel);border-color:var(--steel);color:#fff}
.rub .hd{font-weight:700;font-size:clamp(11px,1.5vh,15px);color:var(--muted);text-align:center;letter-spacing:.04em}
.rub .tot{grid-column:1/-1;font-weight:700;color:var(--steel-d);font-size:clamp(13px,1.9vh,19px);padding-top:4px}

/* jeda */
.jeda{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:clamp(10px,1.6vw,30px);align-items:center;width:100%}
.jeda .pc{--ah:20vh}
.jring{display:flex;flex-direction:column;align-items:center;gap:8px}
.jring .ring{width:clamp(120px,24vh,270px);height:clamp(120px,24vh,270px)}
@media (max-width:900px){.jeda{grid-template-columns:repeat(3,minmax(0,1fr))}.jring{grid-column:1/-1}}

/* garis aman */
.floor{position:relative;width:min(100%,140vh);height:clamp(220px,46vh,520px);border-radius:calc(var(--r)*1.6);background:linear-gradient(#DCE4EA 0 30%,#EEF2F5 30%);box-shadow:0 6px 0 var(--line);overflow:hidden}
.floor .tbl{position:absolute;left:50%;top:3%;transform:translateX(-50%);width:28%;height:13%;background:#B9C7D2;border-radius:10px;display:flex;align-items:center;justify-content:center}
.floor .tbl svg{height:88%;width:auto}
.floor .line{position:absolute;left:0;right:0;top:46%;height:clamp(14px,2.4vh,26px);background:repeating-linear-gradient(90deg,var(--gold) 0 40px,#C9922E 40px 80px)}
.floor .line span{position:absolute;right:12px;top:100%;margin-top:6px;font-weight:700;color:var(--steel-d);font-size:clamp(12px,1.8vh,18px)}
.floor .zone{position:absolute;left:12px;top:4%;font-weight:700;color:var(--heat);font-size:clamp(12px,1.8vh,18px);letter-spacing:.06em;text-transform:uppercase}
.kid{position:absolute;width:clamp(56px,10vh,110px);display:flex;flex-direction:column;align-items:center;gap:4px;transition:top .8s ease,left .8s ease;transform:translateX(-50%)}
.kid .sym{width:clamp(52px,9vh,100px);height:clamp(52px,9vh,100px);border-radius:50%;background:var(--mc);color:#fff;display:grid;place-items:center;border:4px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.kid .sym svg{width:60%;height:60%}
.kid b{font-family:var(--display);font-weight:700;font-size:clamp(12px,1.8vh,19px);color:var(--ink);background:#fff;border-radius:999px;padding:0 .5em}
.kid.safe .sym{box-shadow:0 0 0 5px var(--ok)}

/* pertama–lalu */
.ft{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:clamp(10px,1.6vw,30px);align-items:stretch;width:min(100%,150vh)}
.ftc{display:flex;flex-direction:column;align-items:center;gap:10px;border-radius:calc(var(--r)*1.6);background:#fff;box-shadow:0 6px 0 var(--line);padding:clamp(10px,1.8vh,22px);border-top:clamp(36px,6vh,64px) solid var(--fc);position:relative}
.ftc .ftl{position:absolute;top:calc(-1 * clamp(36px,6vh,64px));left:0;right:0;height:clamp(36px,6vh,64px);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:clamp(14px,2.4vh,26px)}
.ftc .art{height:clamp(80px,22vh,250px)}
.ftc .art svg{height:100%;width:auto}
.ftc p{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(17px,3.2vh,36px);color:var(--steel-d);text-align:center;text-wrap:balance}
.ftc.done{background:var(--ok-l)}
.ftarr{display:grid;place-items:center;color:var(--gold-d)}
.ftarr svg{width:clamp(40px,7vh,80px);height:auto}
.ftc .bx{position:absolute;right:10px;bottom:10px;width:clamp(36px,6vh,64px);height:clamp(36px,6vh,64px);border-radius:12px;border:4px solid var(--ok);display:grid;place-items:center;color:var(--ok)}
.ftc.done .bx{background:var(--ok);color:#fff}
.ftc .bx svg{width:70%;height:70%;opacity:0}
.ftc.done .bx svg{opacity:1}

/* papan AAC */
.aac{display:flex;flex-direction:column;gap:12px;width:100%}
.strip{display:flex;align-items:center;gap:10px;min-height:clamp(60px,10vh,110px);background:#fff;border:3px solid var(--line);border-radius:18px;padding:8px 12px;flex-wrap:wrap}
.strip .ph0{color:var(--muted);font-weight:700;font-size:clamp(14px,2.2vh,22px)}
.strip span.w{display:inline-flex;align-items:center;gap:6px;background:var(--steel-l);border-radius:12px;padding:4px 10px;font-family:var(--display);font-weight:700;font-size:clamp(16px,2.8vh,30px);color:var(--steel-d)}
.strip span.w svg{height:1.4em;width:auto}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(96px,13vh,150px),1fr));gap:10px}
.sym{touch-action:manipulation}
.asym{display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:16px;background:#fff;border:4px solid var(--ac);padding:8px 4px 6px}
.asym .art{height:clamp(44px,8vh,90px);display:grid;place-items:center}
.asym .art svg{height:100%;width:auto}
.asym b{font-family:var(--display);font-weight:700;font-size:clamp(14px,2.2vh,22px);color:var(--ink)}
.asym:active{transform:translateY(3px)}
.agl{font-weight:700;font-size:clamp(12px,1.6vh,16px);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* token bintang */
.tok{display:grid;grid-template-columns:auto 1fr auto;gap:12px 16px;align-items:center}
.tok .nm2{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:clamp(16px,2.6vh,28px)}
.tok .nm2 .sym{width:clamp(36px,5.6vh,60px);height:clamp(36px,5.6vh,60px);border-radius:50%;background:var(--mc);color:#fff;display:grid;place-items:center}
.tok .nm2 .sym svg{width:62%;height:62%}
.stars{display:flex;gap:8px}
.stars button{width:clamp(40px,7vh,74px);height:clamp(40px,7vh,74px);border-radius:14px;background:var(--mist);border:3px solid var(--line);color:#C9D3DB;display:grid;place-items:center}
.stars button svg{width:70%;height:70%}
.stars button.on{background:var(--gold-l);border-color:var(--gold);color:var(--gold)}
.tok .rw{font-size:clamp(12px,1.8vh,18px);color:var(--muted);font-weight:700;max-width:22em}
.tok .rw.full{color:var(--ok)}

/* bilah bawah guru */
.bot{display:flex;align-items:center;gap:clamp(6px,.7vw,12px);padding:clamp(6px,.9vh,10px) max(16px,1.6vw);padding-bottom:calc(clamp(6px,.9vh,10px) + env(safe-area-inset-bottom,0px));background:#fff;border-top:2px solid var(--line);overflow:hidden}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:clamp(44px,6.4vh,68px);min-width:clamp(44px,6.4vh,68px);padding:0 clamp(8px,1vw,16px);border-radius:14px;background:var(--steel-l);color:var(--steel-d);font-weight:700;font-size:clamp(13px,1.85vh,19px);flex:none}
.tb svg{width:clamp(20px,3vh,32px);height:clamp(20px,3vh,32px)}
.tb.on{background:var(--steel);color:#fff}
.tb.nav{background:var(--steel);color:#fff;padding:0 clamp(14px,1.6vw,28px)}
.tb.nav[disabled]{opacity:.35}
.tb.warm{background:var(--gold-l);color:var(--gold-d)}
.tb .lbl{white-space:nowrap}
.tb.mini{flex-direction:column;gap:2px;padding:4px clamp(6px,.6vw,10px);font-size:clamp(11px,1.4vh,14px);min-width:clamp(44px,5.4vw,96px)}
.tb.mini svg{width:clamp(20px,2.8vh,30px);height:clamp(20px,2.8vh,30px)}
.count{font-family:var(--display);font-weight:700;color:var(--muted);font-size:clamp(13px,1.9vh,19px);white-space:nowrap;font-variant-numeric:tabular-nums}
.spacer{flex:1}
@media (max-width:1500px){.tb.mini .lbl{display:none}.tb.mini{min-width:clamp(44px,4.4vw,70px)}}
@media (max-width:760px){.tb .lbl{display:none}.count{display:none}}

/* catatan guru */
.note{position:absolute;right:max(16px,2vw);top:clamp(10px,2vh,26px);width:min(480px,44vw);max-height:calc(100% - 20px);overflow:auto;background:#fff;border:3px solid var(--gold);border-radius:18px;padding:16px 18px;box-shadow:0 18px 40px rgba(0,0,0,.18);z-index:20;color:var(--ink);user-select:text;-webkit-user-select:text}
.note h3{margin:0 0 6px;font-family:var(--display);font-weight:700;color:var(--steel-d);font-size:clamp(15px,2.2vh,21px)}
.note p{margin:0 0 8px;font-size:clamp(14px,1.95vh,19px);line-height:1.45}
.note .rpm{font-weight:700;color:var(--gold-d);font-size:clamp(12px,1.6vh,16px);letter-spacing:.06em;text-transform:uppercase}
@media (max-width:760px){.note{width:calc(100% - 32px)}}

/* peringatan transisi */
.warn{position:absolute;right:max(16px,2vw);bottom:clamp(8px,1.4vh,16px);z-index:30;display:flex;align-items:center;gap:clamp(10px,1.2vw,20px);background:#fff;border:4px solid var(--gold);border-radius:999px;padding:6px clamp(14px,1.4vw,24px) 6px 6px;box-shadow:0 12px 30px rgba(0,0,0,.18);max-width:calc(100% - 32px)}
.warn .wr{width:clamp(48px,8vh,86px);height:clamp(48px,8vh,86px);flex:none}
.warn .wt{font-family:var(--display);font-weight:700;font-size:clamp(16px,3vh,34px);color:var(--steel-d);white-space:nowrap}
.warn .wn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:clamp(13px,2.1vh,22px);color:var(--muted);white-space:nowrap}
.warn .wn .ic2{height:clamp(30px,5vh,54px);width:auto}
.warn .wn .ic2 svg{height:100%;width:auto}

/* layar jeda gelap */
.calm{position:fixed;inset:0;z-index:80;background:#0B141B;display:grid;place-items:center;color:#7F98AA;font-family:var(--display);font-weight:600;font-size:clamp(16px,2.6vh,28px)}
.calm .orb{width:clamp(120px,30vh,320px);height:clamp(120px,30vh,320px);border-radius:50%;background:radial-gradient(circle,#2E5E7E 0,#1D3F57 60%,rgba(29,63,87,0) 72%);animation:breathe 8s ease-in-out infinite}
.calm .ct{display:flex;flex-direction:column;align-items:center;gap:clamp(16px,3vh,40px)}
@keyframes breathe{0%,100%{transform:scale(.7)}50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.calm .orb{animation:none}}

/* kartu besar layar penuh (Perubahan, Selesai) */
.bigcard{position:fixed;inset:0;z-index:70;background:rgba(20,34,44,.7);display:grid;place-items:center;padding:16px}
.bigcard .bc{background:#fff;border-radius:28px;padding:clamp(20px,4vh,50px) clamp(24px,4vw,70px);display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2vh,26px);max-width:min(1100px,100%);border-top:clamp(18px,3vh,30px) solid var(--bcc)}
.bigcard .bc .art{height:clamp(110px,28vh,320px)}
.bigcard .bc .art svg{height:100%;width:auto}
.bigcard .bc b{font-family:var(--display);font-weight:700;font-size:clamp(34px,9vh,110px);color:var(--bcc);letter-spacing:.04em}
.bigcard .bc p{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(18px,3.6vh,40px);color:var(--steel-d);text-align:center;text-wrap:balance}

/* toast dan pengatur waktu mengambang */
.toast{position:fixed;left:50%;bottom:14vh;transform:translateX(-50%) translateY(10px);opacity:0;background:var(--steel-d);color:#fff;font-family:var(--display);font-weight:700;font-size:clamp(20px,4.4vh,50px);padding:.25em .9em;border-radius:999px;z-index:90;pointer-events:none;transition:opacity .3s,transform .3s;display:flex;align-items:center;gap:.4em;max-width:calc(100% - 32px);text-align:center}
.toast svg{width:1em;height:1em;color:var(--gold);flex:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.ftimer{position:fixed;right:max(16px,2vw);bottom:calc(clamp(56px,8.4vh,92px) + 10px);z-index:40;background:#fff;border-radius:20px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:10px 14px;display:flex;align-items:center;gap:12px;border:3px solid var(--line)}
.ftimer svg.rg{width:clamp(64px,10vh,110px);height:clamp(64px,10vh,110px)}
.ftimer .tt{font-family:var(--display);font-weight:700;font-size:clamp(20px,3.6vh,38px);color:var(--steel-d);font-variant-numeric:tabular-nums}
.ftimer .lb{font-weight:700;color:var(--muted);font-size:clamp(11px,1.5vh,15px);letter-spacing:.06em;text-transform:uppercase}
.ftimer .trow{display:flex;gap:6px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,34,44,.55);display:grid;place-items:center;z-index:50;padding:16px}
.mbox{background:#fff;border-radius:22px;width:min(1500px,100%);max-height:92vh;overflow:auto;padding:clamp(16px,2.4vh,30px) clamp(16px,2vw,34px);box-shadow:0 30px 60px rgba(0,0,0,.3)}
.mbox h2{margin:0;font-family:var(--display);font-weight:700;color:var(--steel-d);font-size:clamp(20px,3.2vh,32px)}
.mbox h3{margin:0;font-family:var(--display);font-weight:700;color:var(--steel-d);font-size:clamp(16px,2.3vh,22px)}
.mhead{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:12px}
.small{font-size:clamp(13px,1.8vh,17px);color:var(--muted);line-height:1.45}
.atabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tblwrap{overflow-x:auto;border-radius:14px;border:2px solid var(--line);background:#fff}
table.as{border-collapse:collapse;width:100%;font-size:clamp(14px,1.9vh,19px)}
table.as th,table.as td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.as th{background:var(--steel);color:#fff;font-weight:700;position:sticky;top:0}
table.as td.c,table.as th.c{text-align:center}
table.as select{font-weight:700;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--mist);min-width:5em}
table.as tr:nth-child(even) td{background:var(--mist)}
.kat{display:inline-block;min-width:2.2em;text-align:center;border-radius:8px;padding:2px 8px;color:#fff;font-weight:700}
.kat.A{background:var(--ok)} .kat.B{background:var(--cold)} .kat.C{background:var(--gold-d)} .kat.D{background:var(--heat)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:10px 2px 0;color:var(--muted);font-size:clamp(12px,1.7vh,16px)}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px}
.rcard{border-radius:16px;background:#fff;border:2px solid var(--line);overflow:hidden}
.rcard .rh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;color:#fff;font-family:var(--display);font-weight:700;font-size:clamp(16px,2.3vh,22px)}
.rcard .rb{padding:10px 14px;font-size:clamp(13px,1.8vh,16px);line-height:1.45}
.rcard .rb p{margin:0 0 6px}
.draft{background:var(--mist);border-radius:10px;padding:8px 10px;margin-top:6px}
textarea.copy{width:100%;min-height:140px;margin-top:12px;border-radius:12px;border:2px solid var(--line);padding:10px;font-size:14px;user-select:text;-webkit-user-select:text}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:700;color:var(--muted);font-size:clamp(13px,1.8vh,17px)}
.form input,.form select,.form textarea{min-height:46px;border-radius:12px;border:2px solid var(--line);padding:8px 12px;font-size:clamp(15px,2vh,19px);background:#fff;user-select:text;-webkit-user-select:text}
.abcl{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.abci{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;background:var(--mist);border-radius:12px;padding:10px 12px;border-left:6px solid var(--mc)}
.abci b{font-family:var(--display)}

/* beranda */
.home{height:100%;overflow:auto;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(16px,3vw,60px);padding:clamp(16px,4vh,56px) max(16px,4vw);align-items:center;background:linear-gradient(160deg,#F3F6F8 0%,#E6EEF4 100%)}
.home .eyebrow{font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-d);font-size:clamp(12px,1.75vh,18px)}
.home h1{margin:.2em 0 .15em;font-family:var(--display);font-weight:700;color:var(--steel-d);font-size:clamp(36px,8.4vh,100px);line-height:1;letter-spacing:-.02em;text-wrap:balance}
.home h1 em{font-style:normal;color:var(--cold)}
.home p.sub{margin:0 0 clamp(14px,2.6vh,30px);font-size:clamp(16px,2.4vh,25px);color:var(--muted);max-width:34em;line-height:1.4}
.hcards{display:flex;flex-direction:column;gap:clamp(10px,1.6vh,18px)}
.hcard{display:flex;align-items:center;gap:clamp(12px,1.4vw,22px);text-align:left;border-radius:22px;padding:clamp(12px,1.8vh,20px) clamp(14px,1.6vw,26px);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.hcard .hi{flex:none;width:clamp(52px,8.4vh,90px);height:clamp(52px,8.4vh,90px);border-radius:16px;background:rgba(255,255,255,.95);display:grid;place-items:center;padding:8px}
.hcard .hi svg{width:100%;height:100%}
.hcard b{display:block;font-family:var(--display);font-weight:700;font-size:clamp(18px,3vh,32px);line-height:1.1}
.hcard span{display:block;font-size:clamp(13px,1.95vh,19px);opacity:.92}
.hcard .go{margin-left:auto;font-family:var(--display);font-weight:700;font-size:clamp(13px,2vh,21px);white-space:nowrap}
.hlinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:clamp(12px,2.4vh,26px)}
.hint{margin-top:clamp(10px,2vh,22px);color:var(--muted);font-size:clamp(13px,1.8vh,17px);max-width:44em;line-height:1.45}
.hero{display:flex;flex-direction:column;gap:clamp(12px,2vh,22px)}
.hstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(6px,.8vw,14px);background:#fff;border-radius:24px;padding:clamp(12px,2vh,22px);box-shadow:0 18px 40px rgba(29,63,87,.12)}
.hstrip .hs{display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:16px;background:var(--mist);padding:clamp(8px,1.6vh,16px) 6px}
.hstrip .hs .art{height:clamp(56px,13vh,150px)}
.hstrip .hs .art svg{height:100%;width:auto}
.hstrip .hs b{font-family:var(--display);font-weight:700;font-size:clamp(14px,2.4vh,26px);color:var(--steel-d)}
.hstrip .hs small{font-weight:700;font-size:clamp(11px,1.6vh,16px);color:var(--muted)}
.hmur{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hm{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:8px 12px;border-left:8px solid var(--mc)}
.hm .sym{width:clamp(34px,5vh,54px);height:clamp(34px,5vh,54px);border-radius:50%;background:var(--mc);color:#fff;display:grid;place-items:center;flex:none}
.hm .sym svg{width:62%;height:62%}
.hm b{display:block;font-family:var(--display);font-weight:700;font-size:clamp(15px,2.3vh,24px)}
.hm span{display:block;font-size:clamp(12px,1.6vh,16px);color:var(--muted)}
@media (max-width:900px){.home{grid-template-columns:1fr;align-items:start}}

.diri{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}.diri .hm{flex-direction:column;align-items:flex-start;gap:6px}.diri .hm .who{display:flex;align-items:center;gap:10px}.diri .hm .opts2{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:900px){.diri{grid-template-columns:repeat(2,minmax(0,1fr))}}

.obsp{flex:none;display:flex;align-items:center;gap:8px;background:#fff;color:var(--steel-d);border-radius:14px;padding:4px 12px 4px 6px;font-weight:700;text-align:left}
.obsp .rgw svg{width:clamp(28px,4.6vh,48px);height:clamp(28px,4.6vh,48px)}
.obsp .tt{display:block;font-family:var(--display);font-weight:700;font-size:clamp(14px,2.2vh,24px);font-variant-numeric:tabular-nums;line-height:1.1}
.obsp small{display:block;font-size:clamp(10px,1.3vh,13px);color:var(--muted);white-space:nowrap}
.obsp.due{background:var(--gold-l);box-shadow:0 0 0 3px var(--gold)}
.mi.next{opacity:1;box-shadow:0 0 0 3px var(--gold);background:rgba(224,164,58,.25)}
@media (max-width:700px){.obsp small{display:none}}

.mgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:clamp(10px,1.4vw,24px);width:100%;align-items:start}
@media (max-width:760px){
 .tools{flex-basis:100%}
 .say-btn{width:44px;height:44px}
 .htext h1{font-size:clamp(20px,6.2vw,30px)}
 .bins{grid-template-columns:1fr}
 .thermo{grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
 .fbtn svg{width:64px}
 .bsched{grid-template-columns:repeat(2,minmax(0,1fr))}
 .tbig{grid-template-columns:1fr;justify-items:center}
 .track{grid-template-columns:repeat(2,minmax(0,1fr))}
 .ft{grid-template-columns:1fr}.ftarr{transform:rotate(90deg)}
 .mgrid{grid-template-columns:1fr}
 .cc{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.cc .eq{display:none}.cc .name{grid-column:1/-1}
 .dg{grid-template-columns:1fr;max-width:420px}.dg .links{flex-direction:row;justify-content:center}.dg .lk{flex:1}
 .teach{grid-template-columns:1fr}
 .slots{grid-template-columns:repeat(2,minmax(0,1fr))}
 .rub{grid-template-columns:auto repeat(4,minmax(0,1fr));font-size:12px}
 .match{grid-template-columns:minmax(0,1.2fr) 16px minmax(0,1fr)}
 .story .navbig{width:48px;height:48px}
 .spage p{font-size:clamp(20px,6vw,30px)}
 .diri{grid-template-columns:1fr}
 .fbtn b{font-size:15px;overflow-wrap:anywhere}
 .bot{overflow-x:auto;scrollbar-width:none}
}

const OBS = { total: 900, left: 900, run: false, speed: 1, ms: [0, 0, 0, 0], t: null }; // ms: 0 belum, 1 waktunya Ambil, 2 sudah diambil
function obsTick() {

  OBS.t = setTimeout(() => {

    [0, 300, 600, 900].forEach((s, i) => { if (el >= s && OBS.ms[i] === 0) { OBS.ms[i] = 1; chime(); say(`Menit ${['nol', 'lima', 'sepuluh', 'lima belas'][i]}. ${nm(3)}, katakan: Ambil!`); toast(`Menit ${s / 60} · Ambil!`); } });
    if (OBS.left === 0) { OBS.run = false; }
    obsDraw(); obsTick();
  }, 1000 / OBS.speed);
}
function obsStart() { if (OBS.left === 0) obsReset(); OBS.run = true; setTimeout(refreshTop, 0); if (OBS.ms[0] === 0) { OBS.ms[0] = 1; chime(); say(`Menit nol. ${nm(3)}, katakan: Ambil!`); } obsDraw(); obsTick(); }

function obsReset() { OBS.run = false; clearTimeout(OBS.t); OBS.left = OBS.total; OBS.ms = [0, 0, 0, 0]; obsDraw(); }
